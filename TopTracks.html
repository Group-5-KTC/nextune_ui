<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    </style>
  </head>
<body>
 <div class="w-full bg-[#121212] text-white font-sans px-8 py-6">
  <!-- Header -->
  <div class="flex items-center justify-between mb-4">
    <div>
      <h2 class="text-2xl font-bold underline underline-offset-4">Top tracks this month</h2>
      <p class="text-sm text-gray-400">Only visible to you</p>
    </div>
    <button class="text-sm font-semibold text-gray-300 hover:underline">Show all</button>
  </div>

  <!-- Track List -->
  <div class="space-y-4">
    
    <!-- Track Item 1 -->
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-4">
        <span class="text-gray-400 w-4">1</span>
        <img src="https://i.scdn.co/image/ab67616d0000b273f7b16d3b27aa0b30e308dd5f" class="w-12 h-12 object-cover rounded" alt="Album">
        <div>
          <p class="font-semibold">bình yên</p>
          <p class="text-sm text-gray-400">Vũ., Binz</p>
        </div>
      </div>
      <div class="flex items-center gap-8 text-sm text-gray-300">
        <p>Bảo Tàng Của Nuối Tiếc</p>
        <div class="flex items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-green-500" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414L8.414 15l-5.121-5.121a1 1 0 111.414-1.414L8.414 12.172l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
          </svg>
          <span>3:15</span>
        </div>
      </div>
    </div>

    <!-- Track Item 2 -->
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-4">
        <span class="text-gray-400 w-4">2</span>
        <img src="https://i.scdn.co/image/ab67616d0000b2739a2715f2f0ed02cb8c8f78f3" class="w-12 h-12 object-cover rounded" alt="Album">
        <div>
          <p class="font-semibold">Lemon</p>
          <p class="text-sm text-gray-400">Kenshi Yonezu</p>
        </div>
      </div>
      <div class="flex items-center gap-8 text-sm text-gray-300">
        <p>STRAY SHEEP</p>
        <span>4:15</span>
      </div>
    </div>

    <!-- Track Item 3 -->
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-4">
        <span class="text-gray-400 w-4">3</span>
        <img src="https://i.scdn.co/image/ab67616d0000b273a6ec71e8e6c8b8fa02a2b25b" class="w-12 h-12 object-cover rounded" alt="Album">
        <div>
          <p class="font-semibold">TRỊNH</p>
          <p class="text-sm text-gray-400 flex items-center gap-1">
            <span class="bg-gray-600 px-1 text-xs rounded">E</span> HIEUTHUHAI
          </p>
        </div>
      </div>
      <div class="flex items-center gap-8 text-sm text-gray-300">
        <p>TRỊNH</p>
        <span>4:35</span>
      </div>
    </div>

    <!-- Track Item 4 -->
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-4">
        <span class="text-gray-400 w-4">4</span>
        <img src="https://i.scdn.co/image/ab67616d0000b2732bded6900d1a3122a5c61eb1" class="w-12 h-12 object-cover rounded" alt="Album">
        <div>
          <p class="font-semibold">Bước Qua Nhau</p>
          <p class="text-sm text-gray-400">Vũ.</p>
        </div>
      </div>
      <div class="flex items-center gap-8 text-sm text-gray-300">
        <p>Một Vạn Năm</p>
        <span>4:17</span>
      </div>
    </div>

  </div>
</div>
</body>
