<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <div>
      <nav class="bg-[#000000] p-2">
        <div class="flex justify-between text-white">
          <div class="flex navbar-right justify-between items-center">
            <div class="icon1 rounded-full bg-white h-[38px] w-[38px] p-3">
              Sp
            </div>
            <div
              class="icon2 mx-2 rounded-full bg-[#282828] hover:bg-[#363636] h-[48px] w-[48px] p-3"
            >
              HO
            </div>
            <div
              class="search flex justify-between items-center bg-[#282828] rounded-full px-4 py-2 w-[466px] h-[47px] hover:bg-[#363636] text- hover:text-white"
            >
              <div class="icon-search">
                <button class="btn-search">Search</button>
              </div>
              <input
                type="text"
                placeholder="What do you want to play?"
                class="bg-transparent text-white w-full outline-none ml-2"
              />

              <div class="h-[24px] w-[1px] bg-[#7C7C7C]"></div>
              <div class="icon-mic ml-2 bg-[#7C7C7C]">Icon</div>
            </div>
          </div>
          <div
            class="navbar-left flex justify-between justify-end items-center space-x-4 font-semibold text-[#b3b3b3]"
          >
            <div class="flex font-bold space-x-2">
              <span class="hover:text-white">Premium</span>
              <span class="hover:text-white">Support</span>
              <span class="hover:text-white">Download</span>
            </div>
            <div class="h-[28px] w-[2px] bg-white"></div>
            <div class="flex hover:text-white">
              <div class="mr-2">icon</div>
              <span>Install App</span>
            </div>
            <span class="hover:text-white">Sign up</span>
            <button
              class="bg-white text-black p-2 w-[104px] h-[45px] rounded-[28px] font-bold hover:bg-[#EEEEEE]"
            >
              Log in
            </button>
          </div>
        </div>
      </nav>
    </div>
  </body>
</html>
